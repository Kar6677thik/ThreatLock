# Continuous integration: every pull request and every push to main must build and pass all tests.
# Deployment (M10) will be a separate workflow that runs only after this one succeeds on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A new push to the same PR cancels the run that is still going for the previous push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (.NET build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to a commit SHA (tags can be moved to point at malicious code).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore

      # Warnings are errors (Directory.Build.props), so this also enforces the analyzers.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Integration tests start PostgreSQL and Redis with Testcontainers; GitHub's Ubuntu
      # runners have Docker preinstalled, so no service containers are needed here.
      - name: Test
        run: dotnet test --no-build --configuration Release

      # Report only: this command exits 0 even when it finds something. The actual gate is
      # NuGet's audit during restore, whose warnings fail the build via TreatWarningsAsErrors.
      - name: List vulnerable packages
        run: dotnet list package --vulnerable --include-transitive

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci installs exactly what package-lock.json says, and fails if it is out of date.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end (Playwright against the full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same PostgreSQL and Redis versions as Compose and the tests, on the ports the
    # Development settings expect.
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: threatlock
          POSTGRES_USER: threatlock
          POSTGRES_PASSWORD: threatlock-dev
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U threatlock -d threatlock" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:8.10.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the API and the Worker
        run: dotnet build src/ThreatLock.Api && dotnet build src/ThreatLock.Worker

      # Development settings: dev connection strings, migrations on startup, the dev simulator key.
      # A one-line Tor list (a documentation address) so the test doesn't depend on torproject.org.
      - name: Start the API and the Worker
        run: |
          echo "198.51.100.77" > "$RUNNER_TEMP/tor.txt"
          nohup dotnet run --no-build --project src/ThreatLock.Api --launch-profile http > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5080/readyz && break; sleep 1; done
          Tor__ListPath="$RUNNER_TEMP/tor.txt" nohup dotnet run --no-build --project src/ThreatLock.Worker > "$RUNNER_TEMP/worker.log" 2>&1 &
          sleep 5

      - name: Install and start the SPA
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          nohup npx vite --port 5173 > "$RUNNER_TEMP/vite.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ > /dev/null && break; sleep 1; done

      - name: Playwright
        working-directory: web
        env:
          E2E_TOR_IP: 198.51.100.77
        run: npm run e2e

      - name: Logs on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/worker.log" "$RUNNER_TEMP/vite.log"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
